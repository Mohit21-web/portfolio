<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;

background:linear-gradient(135deg,#050816,#111827);

color:white;

}

.container{

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

padding:50px;

border-radius:20px;

text-align:center;

width:420px;

box-shadow:0 0 30px rgba(0,229,255,.3);

animation:pop .8s;

}

@keyframes pop{

0%{
transform:scale(.6);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

.tick{

font-size:80px;

margin-bottom:20px;

}

h1{

font-size:36px;

margin-bottom:15px;

color:#00E5FF;

}

p{

color:#ddd;

line-height:1.7;

margin-bottom:30px;

}

a{

display:inline-block;

padding:14px 35px;

background:#00E5FF;

text-decoration:none;

border-radius:50px;

font-weight:bold;

color:black;

transition:.4s;

}

a:hover{

transform:translateY(-5px);

box-shadow:0 0 20px #00E5FF;

}

</style>

</head>

<body>

<div class="container">

<div class="tick">✅</div>

<h1>Thank You!</h1>

<p>

Your message has been sent successfully.

I will get back to you as soon as possible.

</p>

<a href="index.html">

⬅ Back to Portfolio

</a>

</div>

</body>
</html>
