<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;

height:100vh;

background:linear-gradient(135deg,#020617,#0f172a,#111827);

overflow:hidden;

}

/* Background Glow */

body::before{

content:"";

position:absolute;

width:350px;
height:350px;

background:#00E5FF;

filter:blur(160px);

opacity:.18;

animation:move 8s infinite alternate;

}

@keyframes move{

0%{

transform:translate(-120px,-120px);

}

100%{

transform:translate(120px,80px);

}

}

/* Card */

.card{

position:relative;

width:420px;

padding:50px;

text-align:center;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.12);

border-radius:25px;

box-shadow:0 0 45px rgba(0,229,255,.25);

animation:card .8s ease;

z-index:2;

}

@keyframes card{

from{

opacity:0;

transform:translateY(40px) scale(.9);

}

to{

opacity:1;

transform:translateY(0) scale(1);

}

}

/* Check Circle */

.circle{

width:120px;
height:120px;

border-radius:50%;

margin:auto;

background:#00E5FF;

display:flex;

justify-content:center;
align-items:center;

box-shadow:0 0 35px #00E5FF;

animation:pulse 2s infinite;

}

@keyframes pulse{

0%{

transform:scale(1);

box-shadow:0 0 20px #00E5FF;

}

50%{

transform:scale(1.08);

box-shadow:0 0 55px #00E5FF;

}

100%{

transform:scale(1);

box-shadow:0 0 20px #00E5FF;

}

}

/* SVG */

svg{

width:60px;

height:60px;

stroke:#050816;

stroke-width:7;

fill:none;

stroke-linecap:round;

stroke-linejoin:round;

stroke-dasharray:100;

stroke-dashoffset:100;

animation:draw 1s forwards .4s;

}

@keyframes draw{

to{

stroke-dashoffset:0;

}

}

h1{

margin-top:30px;

font-size:36px;

color:white;

}

p{

margin-top:15px;

color:#cbd5e1;

line-height:1.7;

}

.button{

display:inline-block;

margin-top:30px;

padding:14px 34px;

background:#00E5FF;

color:#050816;

text-decoration:none;

font-weight:700;

border-radius:40px;

transition:.3s;

}

.button:hover{

transform:translateY(-4px);

box-shadow:0 0 25px #00E5FF;

}

.redirect{

margin-top:18px;

font-size:14px;

color:#94a3b8;

}

</style>

</head>

<body>

<div class="card">

<div class="circle">

<svg viewBox="0 0 52 52">

<path d="M14 27 L23 36 L39 18"/>

</svg>

</div>

<h1>Thank You!</h1>

<p>

Your message has been sent successfully.<br>

I will get back to you as soon as possible.

</p>

<a href="index.html" class="button">

Back to Portfolio

</a>

<p class="redirect">

Redirecting in <span id="count">5</span> seconds...

</p>

</div>

<script>

let sec=5;

const counter=document.getElementById("count");

const timer=setInterval(()=>{

sec--;

counter.innerHTML=sec;

if(sec==0){

clearInterval(timer);

window.location.href="index.html";

}

},1000);

</script>

</body>
</html>
